<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMC · Raw Dump A0-A9</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #0a0a0a; 
    color: #0f0; 
    font-family: 'Courier New', monospace; 
    padding: 20px;
    font-size: 14px;
  }
  h1 { color: #0ff; margin-bottom: 20px; font-size: 24px; }
  .panel { 
    border: 1px solid #333; 
    padding: 15px; 
    margin-bottom: 20px; 
    background: #111;
  }
  button { 
    background: #222; 
    color: #0f0; 
    border: 1px solid #0f0; 
    padding: 10px 20px; 
    cursor: pointer; 
    margin: 5px;
    font-family: inherit;
    font-size: 14px;
  }
  button:hover { background: #0f0; color: #000; }
  button:disabled { border-color: #555; color: #555; cursor: not-allowed; }
  button.stop { border-color: #f00; color: #f00; }
  button.stop:hover { background: #f00; color: #000; }
  #status { margin-left: 10px; color: #888; font-size: 12px; }
  #output { 
    height: 600px; 
    overflow-y: auto; 
    background: #000; 
    border: 1px solid #0f0; 
    padding: 10px; 
    font-size: 12px;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
    line-height: 1.4;
  }
  .patch-header { color: #0ff; font-weight: bold; margin-top: 15px; }
  .hex-line { color: #0f0; }
  .hex-offset { color: #888; }
  .log-entry { margin-bottom: 2px; }
  .log-info { color: #0ff; }
  .log-success { color: #0f0; }
  .log-error { color: #f00; }
</style>
</head>
<body>

<h1>🎸 FMC · Raw Dump A0-A9 (134 bytes)</h1>

<div class="panel">
  <h3>Conexão MIDI</h3>
  <button id="btnConnect">CONECTAR MIDI</button>
  <span id="status">Desconectado</span>
</div>

<div class="panel">
  <h3>Captura A0-A9</h3>
  <button id="btnStart">▶ CAPTURAR A0-A9</button>
  <button id="btnStop" class="stop" disabled>■ PARAR</button>
  <button id="btnExport"> EXPORTAR TXT</button>
</div>

<div class="panel">
  <h3>Output (formato tela SPI)</h3>
  <div id="output"></div>
</div>

<script>
const ZOOM_MFR = 0x52;
let midiAccess = null, inputPort = null, outputPort = null;
let pendingResponse = null;
let shouldStop = false;
let allDumps = [];

const outputEl = document.getElementById('output');

function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.textContent = `[${time}] ${msg}`;
  outputEl.appendChild(div);
  outputEl.scrollTop = outputEl.scrollHeight;
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function sendRaw(msg) {
  if(!outputPort) return;
  outputEl.appendChild(document.createElement('div')).textContent = `OUT: ${toHex(msg)}`;
  outputPort.send(msg);
}

function sendAwait(msg, ms=2000) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => { pendingResponse = null; rej(new Error('Timeout')); }, ms);
    pendingResponse = d => { clearTimeout(t); res(d); };
    sendRaw(msg);
  });
}

function onMidiMsg(e) {
  const d = new Uint8Array(e.data);
  if(pendingResponse) { pendingResponse(d); pendingResponse = null; }
}

async function connect() {
  log('Iniciando conexão MIDI...', 'info');
  if(!navigator.requestMIDIAccess) throw new Error('Web MIDI não suportado');
  try { midiAccess = await navigator.requestMIDIAccess({ sysex: true }); }
  catch { throw new Error('Acesso MIDI negado'); }
  
  const ins = [...midiAccess.inputs.values()], outs = [...midiAccess.outputs.values()];
  if(!ins.length || !outs.length) throw new Error('Nenhuma porta MIDI encontrada');
  
  const idReq = new Uint8Array([0xF0, 0x7E, 0x00, 0x06, 0x01, 0xF7]);
  let found = false;
  for(const o of outs) {
    for(const i of ins) {
      i.onmidimessage = e => {
        const d = new Uint8Array(e.data);
        if(d.length>=6 && d[0]===0xF0 && d[1]===0x7E && d[3]===0x06 && d[4]===0x02 && d[5]===ZOOM_MFR) {
          found = true;
          inputPort = i; outputPort = o;
          inputPort.onmidimessage = onMidiMsg;
          log(`✓ Dispositivo identificado: ID=0x${d[6].toString(16).toUpperCase()}`, 'success');
        }
      };
    }
    sendRaw(idReq);
    await sleep(500);
    if(found) break;
  }
  if(!found) throw new Error('Nenhum dispositivo Zoom respondendo');
}

function formatPayload(raw134) {
  // raw134 = F0 52 00 63 28 [128 bytes] F7
  // Extrai os 128 bytes de payload (índices 5 a 132)
  const payload = raw134.slice(5, 133);
  
  let output = `0x28 recebido (${raw134.length} bytes)\n`;
  output += `payload: ${payload.length} bytes\n`;
  
  // Formata em linhas de 12 bytes igual à tela SPI
  for(let i = 0; i < payload.length; i += 12) {
    const offset = `[${i.toString().padStart(3)}]`;
    const hex = toHex(payload.slice(i, Math.min(i + 12, payload.length)));
    output += `${offset} ${hex}\n`;
  }
  
  return output;
}

async function capturePatch(slot) {
  const patchName = `${String.fromCharCode(65 + Math.floor(slot/10))}${slot%10}`;
  
  outputEl.appendChild(document.createElement('div')).className = 'patch-header';
  outputEl.lastChild.textContent = `\n=== Patch ${patchName} (slot ${slot}) ===`;
  
  try {
    // Bank Select + Program Change
    sendRaw(new Uint8Array([0xB0, 0x00, 0x00]));
    await sleep(20);
    sendRaw(new Uint8Array([0xB0, 0x20, Math.floor(slot/10)]));
    await sleep(20);
    sendRaw(new Uint8Array([0xC0, slot%10]));
    await sleep(600);
    
    // Edit Mode Enter
    sendRaw(new Uint8Array([0xF0, ZOOM_MFR, 0x00, 0x63, 0x50, 0x01, 0xF7]));
    await sleep(200);
    
    // Request Patch Data
    const resp = await sendAwait(new Uint8Array([0xF0, ZOOM_MFR, 0x00, 0x63, 0x29, 0xF7]), 2000);
    
    if(resp[4] !== 0x28) throw new Error('Resposta não é 0x28');
    
    // Formata e mostra
    const formatted = formatPayload(resp);
    outputEl.appendChild(document.createElement('div')).className = 'hex-line';
    outputEl.lastChild.textContent = formatted;
    
    allDumps.push({ patch: patchName, slot, raw: Array.from(resp) });
    
    // Edit Mode Exit
    sendRaw(new Uint8Array([0xF0, ZOOM_MFR, 0x00, 0x63, 0x50, 0x00, 0xF7]));
    await sleep(100);
    
  } catch(err) {
    outputEl.appendChild(document.createElement('div')).className = 'log-error';
    outputEl.lastChild.textContent = `✗ Erro: ${err.message}`;
  }
  
  outputEl.scrollTop = outputEl.scrollHeight;
  await sleep(200);
}

async function startCapture() {
  if(!outputPort) { log('MIDI não conectado', 'error'); return; }
  
  shouldStop = false;
  allDumps = [];
  outputEl.innerHTML = '';
  
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnExport').disabled = true;
  
  log('=== INICIANDO CAPTURA A0-A9 ===', 'info');
  
  for(let slot = 0; slot < 10; slot++) {
    if(shouldStop) break;
    await capturePatch(slot);
  }
  
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnExport').disabled = false;
  
  log(`\n=== CAPTURA CONCLUÍDA: ${allDumps.length} patches ===`, 'success');
}

function exportDumps() {
  let txt = `FMC Raw Dump A0-A9 - ${new Date().toISOString()}\n\n`;
  allDumps.forEach(d => {
    txt += `Patch ${d.patch} (slot ${d.slot}):\n`;
    txt += formatPayload(new Uint8Array(d.raw));
    txt += '\n';
  });
  
  const blob = new Blob([txt], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `g1on-raw-dump-A0-A9-${Date.now()}.txt`;
  a.click();
  log('Exportado!', 'success');
}

document.getElementById('btnConnect').onclick = async () => {
  try {
    await connect();
    document.getElementById('status').textContent = 'Conectado';
    document.getElementById('status').style.color = '#0f0';
  } catch(e) { log(`Erro: ${e.message}`, 'error'); }
};

document.getElementById('btnStart').onclick = startCapture;
document.getElementById('btnStop').onclick = () => { shouldStop = true; log('Parando...', 'info'); };
document.getElementById('btnExport').onclick = exportDumps;
</script>
</body>
</html>
