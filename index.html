<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMC · Auto Dump G1On (Clean)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #0a0a0a; 
    color: #0f0; 
    font-family: 'Courier New', monospace; 
    padding: 20px;
    font-size: 14px;
  }
  h1 { color: #0ff; margin-bottom: 20px; font-size: 24px; }
  .panel { 
    border: 1px solid #333; 
    padding: 15px; 
    margin-bottom: 20px; 
    background: #111;
  }
  button { 
    background: #222; 
    color: #0f0; 
    border: 1px solid #0f0; 
    padding: 10px 20px; 
    cursor: pointer; 
    margin: 5px;
    font-family: inherit;
    font-size: 14px;
  }
  button:hover { background: #0f0; color: #000; }
  button:disabled { border-color: #555; color: #555; cursor: not-allowed; }
  button.stop { border-color: #f00; color: #f00; }
  button.stop:hover { background: #f00; color: #000; }
  #status { margin-left: 10px; color: #888; font-size: 12px; }
  #log { 
    height: 400px; 
    overflow-y: auto; 
    background: #000; 
    border: 1px solid #0f0; 
    padding: 10px; 
    font-size: 11px;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
  }
  .log-entry { margin-bottom: 2px; }
  .log-info { color: #0ff; }
  .log-success { color: #0f0; }
  .log-error { color: #f00; }
  .log-warning { color: #ff0; }
  .progress-bar {
    width: 100%;
    height: 20px;
    background: #222;
    border: 1px solid #0f0;
    margin: 10px 0;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: #0f0;
    transition: width 0.3s;
  }
  .progress-text {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    color: #000;
    font-weight: bold;
    line-height: 20px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 10px 0;
  }
  .stat-box {
    background: #222;
    border: 1px solid #333;
    padding: 10px;
    text-align: center;
  }
  .stat-value { font-size: 24px; color: #0ff; font-weight: bold; }
  .stat-label { font-size: 11px; color: #888; margin-top: 5px; }
</style>
</head>
<body>

<h1> FMC · Auto Dump G1On (Clean)</h1>

<div class="panel">
  <h3>Conexão MIDI</h3>
  <button id="btnConnect">CONECTAR MIDI</button>
  <span id="status">Desconectado</span>
</div>

<div class="panel">
  <h3>Varredura Automática (A0 → J9)</h3>
  <div class="stats">
    <div class="stat-box"><div class="stat-value" id="statTotal">100</div><div class="stat-label">TOTAL</div></div>
    <div class="stat-box"><div class="stat-value" id="statDone">0</div><div class="stat-label">SUCESSO</div></div>
    <div class="stat-box"><div class="stat-value" id="statFailed">0</div><div class="stat-label">FALHAS</div></div>
  </div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    <div class="progress-text" id="progressText">0/100</div>
  </div>
  
  <button id="btnStart">▶ INICIAR</button>
  <button id="btnStop" class="stop" disabled>■ PARAR</button>
</div>

<div class="panel">
  <h3>Exportar</h3>
  <button id="btnExportJson" disabled>⬇ JSON</button>
  <button id="btnExportLog" disabled>⬇ LOG TXT</button>
</div>

<div class="panel">
  <h3>Log</h3>
  <div id="log"></div>
</div>

<script>
// ============ CONFIG ============
const CFG = {
  SETTLE_PC: 500,
  SETTLE_EDIT: 200,
  TIMEOUT: 2000,
  DELAY_PATCH: 300
};

// ============ STATE ============
let midiAccess = null, inputPort = null, outputPort = null;
let sysexBuffer = [], pendingResponse = null;
let isRunning = false, shouldStop = false;
let patchResults = [], startTime = null;
let doneCount = 0, failedCount = 0;

const logEl = document.getElementById('log');

function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.textContent = `[${time}] ${msg}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

// ============ MIDI SEND ============
function sendSysEx(bytes) {
  if (!outputPort) return;
  outputPort.send([0xF0, ...bytes, 0xF7]);
  log(`OUT: F0 ${toHex(bytes)} F7`, 'info');
}

function sendBankSelect(bank) {
  if (!outputPort) return;
  // CC#32 (Bank Select LSB) - Channel 1
  outputPort.send([0xB0, 0x20, bank & 0x7F]);
  log(`OUT: B0 20 ${bank.toString(16).padStart(2,'0').toUpperCase()}`, 'info');
}

function sendProgramChange(preset) {
  if (!outputPort) return;
  // Program Change - Channel 1
  outputPort.send([0xC0, preset & 0x7F]);
  log(`OUT: C0 ${preset.toString(16).padStart(2,'0').toUpperCase()}`, 'info');
}

function handleMidiMessage(e) {
  const data = e.data;
  if (data[0] === 0xF0) {
    sysexBuffer = Array.from(data);
  } else if (data[0] === 0xF7 && sysexBuffer.length > 0) {
    sysexBuffer.push(0xF7);
    const fullMsg = sysexBuffer;
    sysexBuffer = [];
    
    if (pendingResponse && fullMsg[4] === 0x28) {
      pendingResponse(fullMsg);
      pendingResponse = null;
    }
  }
}

// ============ ZOOM COMMANDS ============
function sendEditMode(on) {
  sendSysEx([0x52, 0x00, 0x63, 0x50, on ? 0x01 : 0x00]);
}

function requestPatchData() {
  sendSysEx([0x52, 0x00, 0x63, 0x29]);
}

// ============ UTILS ============
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function updateStats() {
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statFailed').textContent = failedCount;
  const total = doneCount + failedCount;
  document.getElementById('progressFill').style.width = `${(total/100)*100}%`;
  document.getElementById('progressText').textContent = `${total}/100`;
}

// ============ DUMP LOOP ============
async function dumpPatch(bank, preset) {
  const patchName = `${String.fromCharCode(65 + bank)}${preset}`;
  log(`--- Patch ${patchName} ---`, 'info');
  
  try {
    // 1. Bank Select + Program Change
    sendBankSelect(bank);
    await sleep(30);
    sendProgramChange(preset);
    await sleep(CFG.SETTLE_PC);
    
    // 2. Edit Mode Enter
    sendEditMode(true);
    await sleep(CFG.SETTLE_EDIT);
    
    // 3. Request with timeout
    let responseData = null;
    const timeoutPromise = sleep(CFG.TIMEOUT);
    const responsePromise = new Promise(resolve => { pendingResponse = resolve; });
    
    requestPatchData();
    responseData = await Promise.race([responsePromise, timeoutPromise.then(() => null)]);
    
    if (!responseData) {
      log(`  ✗ Timeout`, 'error');
      failedCount++;
      patchResults.push({ patch: patchName, bank, preset, success: false, error: 'timeout', payload: null });
    } else {
      const payload = responseData.slice(5, responseData.length - 1);
      log(`  ✓ ${payload.length} bytes`, 'success');
      patchResults.push({
        patch: patchName, bank, preset, success: true,
        payload: Array.from(payload),
        payloadHex: toHex(payload)
      });
      doneCount++;
    }
    
    // 4. Edit Mode Exit
    sendEditMode(false);
    await sleep(CFG.SETTLE_EDIT);
    
  } catch (err) {
    log(`  ✗ Erro: ${err.message}`, 'error');
    failedCount++;
    patchResults.push({ patch: patchName, bank, preset, success: false, error: err.message, payload: null });
  }
  
  updateStats();
  await sleep(CFG.DELAY_PATCH);
}

async function startDump() {
  if (!outputPort) { log('MIDI não conectado', 'error'); return; }
  
  isRunning = true; shouldStop = false;
  startTime = Date.now();
  doneCount = 0; failedCount = 0; patchResults = [];
  
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnExportJson').disabled = true;
  document.getElementById('btnExportLog').disabled = true;
  
  log('=== INICIANDO ===', 'warning');
  
  for (let bank = 0; bank < 10; bank++) {
    for (let preset = 0; preset < 10; preset++) {
      if (shouldStop) break;
      await dumpPatch(bank, preset);
    }
    if (shouldStop) break;
  }
  
  isRunning = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnExportJson').disabled = false;
  document.getElementById('btnExportLog').disabled = false;
  
  log(`=== FIM: ${doneCount} ok, ${failedCount} falhas ===`, 'warning');
}

// ============ EXPORT ============
function exportJson() {
  const data = { timestamp: new Date().toISOString(), stats: { done: doneCount, failed: failedCount }, patches: patchResults };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `g1on-dump-${Date.now()}.json`;
  a.click();
  log('JSON exportado', 'success');
}

function exportLog() {
  let text = `Dump G1On - ${new Date().toISOString()}\n\n`;
  patchResults.forEach(p => {
    text += `${p.patch}: ${p.success ? 'OK' : 'FAIL'}\n`;
    if (p.success) text += `  ${p.payloadHex}\n`;
    else text += `  ${p.error}\n`;
    text += '\n';
  });
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `g1on-dump-${Date.now()}.txt`;
  a.click();
  log('Log exportado', 'success');
}

// ============ SETUP ============
document.getElementById('btnConnect').onclick = async () => {
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: true });
    for (let input of midiAccess.inputs.values()) {
      if (input.name.toLowerCase().includes('zoom') || input.name.toLowerCase().includes('g1')) {
        inputPort = input;
        input.onmidimessage = handleMidiMessage;
        log(`Input: ${input.name}`, 'success');
      }
    }
    for (let output of midiAccess.outputs.values()) {
      if (output.name.toLowerCase().includes('zoom') || output.name.toLowerCase().includes('g1')) {
        outputPort = output;
        log(`Output: ${output.name}`, 'success');
      }
    }
    if (inputPort && outputPort) {
      document.getElementById('status').textContent = 'Conectado';
      document.getElementById('status').style.color = '#0f0';
      log('MIDI pronto', 'success');
    } else {
      log('Porta Zoom não encontrada', 'error');
    }
  } catch (e) { log(`Erro: ${e.message}`, 'error'); }
};

document.getElementById('btnStart').onclick = startDump;
document.getElementById('btnStop').onclick = () => { shouldStop = true; log('Parando...', 'warning'); };
document.getElementById('btnExportJson').onclick = exportJson;
document.getElementById('btnExportLog').onclick = exportLog;

</script>
</body>
</html>
