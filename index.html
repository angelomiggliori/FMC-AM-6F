<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMC · Auto Dump G1On (Minimal)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #0a0a0a; 
    color: #0f0; 
    font-family: 'Courier New', monospace; 
    padding: 20px;
    font-size: 14px;
  }
  h1 { color: #0ff; margin-bottom: 20px; font-size: 24px; }
  .panel { 
    border: 1px solid #333; 
    padding: 15px; 
    margin-bottom: 20px; 
    background: #111;
  }
  button { 
    background: #222; 
    color: #0f0; 
    border: 1px solid #0f0; 
    padding: 10px 20px; 
    cursor: pointer; 
    margin: 5px;
    font-family: inherit;
    font-size: 14px;
  }
  button:hover { background: #0f0; color: #000; }
  button:disabled { border-color: #555; color: #555; cursor: not-allowed; }
  button.stop { border-color: #f00; color: #f00; }
  button.stop:hover { background: #f00; color: #000; }
  #status { margin-left: 10px; color: #888; font-size: 12px; }
  #log { 
    height: 400px; 
    overflow-y: auto; 
    background: #000; 
    border: 1px solid #0f0; 
    padding: 10px; 
    font-size: 11px;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
  }
  .log-entry { margin-bottom: 2px; }
  .log-info { color: #0ff; }
  .log-success { color: #0f0; }
  .log-error { color: #f00; }
  .log-warning { color: #ff0; }
  .progress-bar {
    width: 100%;
    height: 20px;
    background: #222;
    border: 1px solid #0f0;
    margin: 10px 0;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: #0f0;
    transition: width 0.3s;
  }
  .progress-text {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    color: #000;
    font-weight: bold;
    line-height: 20px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 10px 0;
  }
  .stat-box {
    background: #222;
    border: 1px solid #333;
    padding: 10px;
    text-align: center;
  }
  .stat-value { font-size: 24px; color: #0ff; font-weight: bold; }
  .stat-label { font-size: 11px; color: #888; margin-top: 5px; }
</style>
</head>
<body>

<h1>🎸 FMC · Auto Dump G1On (Minimal)</h1>

<div class="panel">
  <h3>Conexão MIDI</h3>
  <button id="btnConnect">CONECTAR MIDI</button>
  <span id="status">Desconectado</span>
</div>

<div class="panel">
  <h3>Varredura A0 → A9 (10 patches)</h3>
  <div class="stats">
    <div class="stat-box"><div class="stat-value" id="statTotal">10</div><div class="stat-label">TOTAL</div></div>
    <div class="stat-box"><div class="stat-value" id="statDone">0</div><div class="stat-label">SUCESSO</div></div>
    <div class="stat-box"><div class="stat-value" id="statFailed">0</div><div class="stat-label">FALHAS</div></div>
  </div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    <div class="progress-text" id="progressText">0/10</div>
  </div>
  
  <button id="btnStart">▶ INICIAR</button>
  <button id="btnStop" class="stop" disabled>■ PARAR</button>
</div>

<div class="panel">
  <h3>Exportar</h3>
  <button id="btnExportJson" disabled>⬇ JSON</button>
  <button id="btnExportLog" disabled>⬇ LOG TXT</button>
</div>

<div class="panel">
  <h3>Log</h3>
  <div id="log"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// HANDSHAKE DO ENGINE.JS (FUNCIONA)
// ═══════════════════════════════════════════════════════════════════════
const ZOOM_MFR = 0x52;
let midiAccess = null, inputPort = null, outputPort = null;
let dev = null;
let pendingResponse = null;
let isRunning = false, shouldStop = false;
let patchResults = [], doneCount = 0, failedCount = 0;

const logEl = document.getElementById('log');

function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.textContent = `[${time}] ${msg}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════════════════════════
// SYSEX HELPERS (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
function sx(did, pl) { return new Uint8Array([0xF0, ZOOM_MFR, 0x00, did, ...pl, 0xF7]); }
function idReq() { return new Uint8Array([0xF0, 0x7E, 0x00, 0x06, 0x01, 0xF7]); }
function pc(s) { return new Uint8Array([0xC0, s & 0x7F]); }

function parseId(d) {
  if(d.length<11 || d[0]!==0xF0 || d[1]!==0x7E || d[3]!==0x06 || d[4]!==0x02) return null;
  if(d[5]!==ZOOM_MFR) return null;
  return { id: d[6], fw: String.fromCharCode(d[9], d[10], d[11], d[12]) };
}

// ═══════════════════════════════════════════════════════════════════════
// MIDI MESSAGE HANDLER
// ═══════════════════════════════════════════════════════════════════════
function onMidiMsg(e) {
  const d = new Uint8Array(e.data);
  log(`IN : ${toHex(d)}`, 'success');
  
  if(pendingResponse) {
    pendingResponse(d);
    pendingResponse = null;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// CONNECT (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
async function probe(ins, outs) {
  for(const o of outs) {
    const r = await probeOut(o, ins);
    if(r) return r;
  }
  return null;
}

async function probeOut(o, ins) {
  return new Promise(res => {
    const orig = ins.map(i => i.onmidimessage);
    const done = r => {
      ins.forEach((i,x) => { i.onmidimessage = orig[x]; });
      clearTimeout(t);
      res(r);
    };
    const t = setTimeout(() => done(null), 1200);
    
    ins.forEach(i => {
      i.onmidimessage = e => {
        const d = new Uint8Array(e.data);
        log(`IN : ${toHex(d)}`, 'success');
        if(d.length>=6 && d[0]===0xF0 && d[1]===0x7E && d[3]===0x06 && d[4]===0x02 && d[5]===ZOOM_MFR)
          done({ i, o, id: parseId(d) });
      };
    });
    
    try {
      const m = idReq();
      log(`OUT: ${toHex(m)}`, 'info');
      o.send(m);
    } catch { done(null); }
  });
}

async function connect() {
  log('Iniciando conexão MIDI...', 'info');
  
  if(!navigator.requestMIDIAccess) throw new Error('Web MIDI não suportado');
  
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: true });
  } catch {
    throw new Error('Acesso MIDI negado');
  }
  
  const ins = [...midiAccess.inputs.values()];
  const outs = [...midiAccess.outputs.values()];
  
  if(!ins.length || !outs.length) throw new Error('Nenhuma porta MIDI encontrada');
  
  log('Escaneando dispositivos...', 'info');
  const f = await probe(ins, outs);
  
  if(!f) throw new Error('Nenhum dispositivo Zoom encontrado');
  
  inputPort = f.i;
  outputPort = f.o;
  inputPort.onmidimessage = onMidiMsg;
  
  const id = f.id;
  dev = { id: id.id, fw: id.fw };
  
  log(`✓ Dispositivo identificado: ID=0x${id.id.toString(16).toUpperCase()} FW=${id.fw}`, 'success');
  return dev;
}

// ═══════════════════════════════════════════════════════════════════════
// READ PATCH (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
function sendRaw(msg) {
  if(!outputPort) return;
  log(`OUT: ${toHex(msg)}`, 'info');
  outputPort.send(msg);
}

function sendAwait(msg, ms=2000) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => {
      pendingResponse = null;
      rej(new Error('Timeout'));
    }, ms);
    pendingResponse = d => {
      clearTimeout(t);
      res(d);
    };
    sendRaw(msg);
  });
}

function paramEditEnable()  { sendRaw(sx(dev.id, [0x50])); }
function paramEditDisable() { sendRaw(sx(dev.id, [0x51])); }

async function readPatch(slot) {
  log(`Lendo patch slot ${slot+1}...`, 'info');
  
  sendRaw(pc(slot));
  await sleep(60);
  
  paramEditEnable();
  await sleep(80);
  
  let resp;
  try {
    resp = await sendAwait(sx(dev.id, [0x29]), 2000);
  } catch(e) {
    log(`✗ readPatch slot ${slot+1} falhou: ${e.message}`, 'error');
    paramEditDisable();
    throw e;
  }
  
  await sleep(40);
  paramEditDisable();
  await sleep(40);
  
  return resp;
}

// ═══════════════════════════════════════════════════════════════════════
// DUMP LOOP
// ═══════════════════════════════════════════════════════════════════════
async function dumpPatch(slot) {
  const patchName = `${String.fromCharCode(65 + Math.floor(slot/10))}${slot%10}`;
  log(`\n=== Patch ${patchName} (slot ${slot}) ===`, 'warning');
  
  try {
    const resp = await readPatch(slot);
    
    if(resp[4] !== 0x28) {
      log(`✗ Resposta não é BulkDump (0x28)`, 'error');
      failedCount++;
      patchResults.push({ patch: patchName, slot, success: false, error: 'wrong_response' });
      return;
    }
    
    const pl = resp.slice(6, -1);
    if(pl.length < 110) {
      log(`✗ Payload muito curto: ${pl.length} bytes`, 'error');
      failedCount++;
      patchResults.push({ patch: patchName, slot, success: false, error: 'short_payload' });
      return;
    }
    
    log(`✓ Recebido ${pl.length} bytes`, 'success');
    
    patchResults.push({
      patch: patchName,
      slot,
      success: true,
      raw: Array.from(pl),
      rawHex: toHex(pl)
    });
    doneCount++;
    
  } catch(err) {
    log(`✗ Erro: ${err.message}`, 'error');
    failedCount++;
    patchResults.push({ patch: patchName, slot, success: false, error: err.message });
  }
  
  updateStats();
  await sleep(100);
}

async function startDump() {
  if(!outputPort) { log('MIDI não conectado', 'error'); return; }
  
  isRunning = true; shouldStop = false;
  doneCount = 0; failedCount = 0; patchResults = [];
  
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnExportJson').disabled = true;
  document.getElementById('btnExportLog').disabled = true;
  
  log('\n=== INICIANDO VARREDURA ===', 'warning');
  
  for(let slot=0; slot<10; slot++) {
    if(shouldStop) break;
    await dumpPatch(slot);
  }
  
  isRunning = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnExportJson').disabled = false;
  document.getElementById('btnExportLog').disabled = false;
  
  log(`\n=== FIM: ${doneCount} ok, ${failedCount} falhas ===`, 'warning');
}

function updateStats() {
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statFailed').textContent = failedCount;
  const total = doneCount + failedCount;
  document.getElementById('progressFill').style.width = `${(total/10)*100}%`;
  document.getElementById('progressText').textContent = `${total}/10`;
}

// ═══════════════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════════════
function exportJson() {
  const data = {
    timestamp: new Date().toISOString(),
    device: dev,
    stats: { done: doneCount, failed: failedCount },
    patches: patchResults
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `g1on-dump-${Date.now()}.json`;
  a.click();
  log('JSON exportado', 'success');
}

function exportLog() {
  let text = `Dump G1On - ${new Date().toISOString()}\n\n`;
  patchResults.forEach(p => {
    text += `${p.patch} (slot ${p.slot}): ${p.success ? 'OK' : 'FAIL'}\n`;
    if(p.success) {
      text += `  ${p.rawHex}\n`;
    } else {
      text += `  Erro: ${p.error}\n`;
    }
    text += '\n';
  });
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `g1on-dump-${Date.now()}.txt`;
  a.click();
  log('Log exportado', 'success');
}

// ═══════════════════════════════════════════════════════════════════════
// SETUP
// ══════════════════════════════════════════════════════════════════════
document.getElementById('btnConnect').onclick = async () => {
  try {
    await connect();
    document.getElementById('status').textContent = 'Conectado';
    document.getElementById('status').style.color = '#0f0';
  } catch(e) {
    log(`Erro: ${e.message}`, 'error');
  }
};

document.getElementById('btnStart').onclick = startDump;
document.getElementById('btnStop').onclick = () => { shouldStop = true; log('Parando...', 'warning'); };
document.getElementById('btnExportJson').onclick = exportJson;
document.getElementById('btnExportLog').onclick = exportLog;

</script>
</body>
</html>
