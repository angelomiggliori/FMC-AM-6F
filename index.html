<script>
// ═══════════════════════════════════════════════════════════════════════
// CODEC ZOOM 7-IN-8 (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
function zoomUnpack(pl){
  const out=[];
  for(let i=0;i<pl.length;i+=8){
    const msb=pl[i];
    out.push(msb&0x7F);
    for(let j=1;j<8&&i+j<pl.length;j++)
      out.push(pl[i+j]|(((msb>>(j-1))&1)<<7));
  }
  return out;
}

function gfx(b0,b1,b3,b4,b5){
  const m=b1&0x7F;
  return FX_BY_KEY[`${b0},${m},${b3},${b4},${b5}`]
    || FX_BY_KEY[`${b0},${m},${b3},${b4}`]
    || FX_BY_KEY[`${b0},${m},${b3}`]
    || {n:`[${b0}/${m}/${b3}]`,c:'Desconhecido',_unknown:true};
}

// ═══════════════════════════════════════════════════════════════════════
// DECODE DE PATCH (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
function decodePatch(pl, slot){
  const u = zoomUnpack(pl);
  const fx = [];
  
  for(let i=0; i<5; i++){
    const s = i*23;
    const b0=u[s], b1=u[s+1], b3=u[s+3], b4=u[s+4], b5=u[s+5];
    const b1m = b1 & 0x7F;
    const en = (b1 & 0x80) !== 0;
    const isEmpty = (b0===0 && b3===0) || (b0===1 && b1m===0 && b3===0);
    const params = Array.from(u.slice(s, s+23));
    const info = isEmpty ? {n:'Empty', c:null} : gfx(b0, b1, b3, b4, b5);
    
    fx.push({
      slot: i,
      b0, b1, b1m, b3, b4, b5,
      isEmpty, en, params,
      name: info.n,
      cat: info.c
    });
  }
  
  const nameBytes = u.slice(115, 125);
  const name = String.fromCharCode(...nameBytes.map(b=>b&0x7F).filter(b=>b!==0)).trimEnd();
  
  return { slot, name, effects: fx, raw: Array.from(pl) };
}

// ═══════════════════════════════════════════════════════════════════════
// MIDI STATE (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
const ZOOM_MFR = 0x52;
let midiAccess = null, inputPort = null, outputPort = null;
let dev = null;
let pendingResponse = null;
let isRunning = false, shouldStop = false;
let patchResults = [], doneCount = 0, failedCount = 0;

const logEl = document.getElementById('log');

function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.textContent = `[${time}] ${msg}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════════════════════════
// SYSEX HELPERS (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
function sx(did, pl) { return new Uint8Array([0xF0, ZOOM_MFR, 0x00, did, ...pl, 0xF7]); }
function idReq() { return new Uint8Array([0xF0, 0x7E, 0x00, 0x06, 0x01, 0xF7]); }
function pc(s) { return new Uint8Array([0xC0, s & 0x7F]); }

function parseId(d) {
  if(d.length<11 || d[0]!==0xF0 || d[1]!==0x7E || d[3]!==0x06 || d[4]!==0x02) return null;
  if(d[5]!==ZOOM_MFR) return null;
  return { id: d[6], fw: String.fromCharCode(d[9], d[10], d[11], d[12]) };
}

// ═══════════════════════════════════════════════════════════════════════
// MIDI MESSAGE HANDLER (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
function onMidiMsg(e) {
  const d = new Uint8Array(e.data);
  log(`IN : ${toHex(d)}`, 'success');
  
  // Resolver await pendente
  if(pendingResponse) {
    pendingResponse(d);
    pendingResponse = null;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// CONNECT (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
async function probe(ins, outs) {
  for(const o of outs) {
    const r = await probeOut(o, ins);
    if(r) return r;
  }
  return null;
}

async function probeOut(o, ins) {
  return new Promise(res => {
    const orig = ins.map(i => i.onmidimessage);
    const done = r => {
      ins.forEach((i,x) => { i.onmidimessage = orig[x]; });
      clearTimeout(t);
      res(r);
    };
    const t = setTimeout(() => done(null), 1200);
    
    ins.forEach(i => {
      i.onmidimessage = e => {
        const d = new Uint8Array(e.data);
        log(`IN : ${toHex(d)}`, 'success');
        if(d.length>=6 && d[0]===0xF0 && d[1]===0x7E && d[3]===0x06 && d[4]===0x02 && d[5]===ZOOM_MFR)
          done({ i, o, id: parseId(d) });
      };
    });
    
    try {
      const m = idReq();
      log(`OUT: ${toHex(m)}`, 'info');
      o.send(m);
    } catch { done(null); }
  });
}

async function connect() {
  log('Iniciando conexão MIDI...', 'info');
  
  if(!navigator.requestMIDIAccess) throw new Error('Web MIDI não suportado');
  
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: true });
  } catch {
    throw new Error('Acesso MIDI negado');
  }
  
  const ins = [...midiAccess.inputs.values()];
  const outs = [...midiAccess.outputs.values()];
  
  if(!ins.length || !outs.length) throw new Error('Nenhuma porta MIDI encontrada');
  
  log('Escaneando dispositivos...', 'info');
  const f = await probe(ins, outs);
  
  if(!f) throw new Error('Nenhum dispositivo Zoom encontrado');
  
  inputPort = f.i;
  outputPort = f.o;
  inputPort.onmidimessage = onMidiMsg;
  
  const id = f.id;
  dev = { id: id.id, fw: id.fw };
  
  log(`✓ Dispositivo identificado: ID=0x${id.id.toString(16).toUpperCase()} FW=${id.fw}`, 'success');
  return dev;
}

// ═══════════════════════════════════════════════════════════════════════
// READ PATCH (do engine.js)
// ═══════════════════════════════════════════════════════════════════════
function sendRaw(msg) {
  if(!outputPort) return;
  log(`OUT: ${toHex(msg)}`, 'info');
  outputPort.send(msg);
}

function sendAwait(msg, ms=2000) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => {
      pendingResponse = null;
      rej(new Error('Timeout'));
    }, ms);
    pendingResponse = d => {
      clearTimeout(t);
      res(d);
    };
    sendRaw(msg);
  });
}

function paramEditEnable() { sendRaw(sx(dev.id, [0x50])); }
function paramEditDisable() { sendRaw(sx(dev.id, [0x51])); }

async function readPatch(slot) {
  log(`Lendo patch slot ${slot+1}...`, 'info');
  
  sendRaw(pc(slot));
  await sleep(60);
  
  paramEditEnable();
  await sleep(80);
  
  let resp;
  try {
    resp = await sendAwait(sx(dev.id, [0x29]), 2000);
  } catch(e) {
    log(`✗ readPatch slot ${slot+1} falhou: ${e.message}`, 'error');
    paramEditDisable();
    throw e;
  }
  
  await sleep(40);
  paramEditDisable();
  await sleep(40);
  
  return resp;
}

// ═══════════════════════════════════════════════════════════════════════
// DUMP LOOP
// ═══════════════════════════════════════════════════════════════════════
async function dumpPatch(slot) {
  const patchName = `${String.fromCharCode(65 + Math.floor(slot/10))}${slot%10}`;
  log(`\n=== Patch ${patchName} (slot ${slot}) ===`, 'warning');
  
  try {
    const resp = await readPatch(slot);
    
    if(resp[4] !== 0x28) {
      log(`✗ Resposta não é BulkDump (0x28)`, 'error');
      failedCount++;
      patchResults.push({ patch: patchName, slot, success: false, error: 'wrong_response' });
      return;
    }
    
    const pl = resp.slice(6, -1);
    if(pl.length < 110) {
      log(`✗ Payload muito curto: ${pl.length} bytes`, 'error');
      failedCount++;
      patchResults.push({ patch: patchName, slot, success: false, error: 'short_payload' });
      return;
    }
    
    const decoded = decodePatch(pl, slot);
    
    log(`✓ Nome: "${decoded.name}"`, 'success');
    log(`✓ Efeitos:`, 'success');
    decoded.effects.forEach((fx, i) => {
      if(!fx.isEmpty) {
        log(`   Slot ${i+1}: ${fx.name} (${fx.cat}) ${fx.en?'ON':'OFF'}`, 'info');
      }
    });
    
    patchResults.push({
      patch: patchName,
      slot,
      success: true,
      name: decoded.name,
      effects: decoded.effects,
      raw: decoded.raw
    });
    doneCount++;
    
  } catch(err) {
    log(`✗ Erro: ${err.message}`, 'error');
    failedCount++;
    patchResults.push({ patch: patchName, slot, success: false, error: err.message });
  }
  
  updateStats();
  await sleep(100);
}

async function startDump() {
  if(!outputPort) { log('MIDI não conectado', 'error'); return; }
  
  isRunning = true; shouldStop = false;
  doneCount = 0; failedCount = 0; patchResults = [];
  
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnExportJson').disabled = true;
  document.getElementById('btnExportLog').disabled = true;
  
  log('\n=== INICIANDO VARREDURA ===', 'warning');
  
  for(let slot=0; slot<10; slot++) {
    if(shouldStop) break;
    await dumpPatch(slot);
  }
  
  isRunning = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnExportJson').disabled = false;
  document.getElementById('btnExportLog').disabled = false;
  
  log(`\n=== FIM: ${doneCount} ok, ${failedCount} falhas ===`, 'warning');
}

function updateStats() {
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statFailed').textContent = failedCount;
  const total = doneCount + failedCount;
  document.getElementById('progressFill').style.width = `${(total/10)*100}%`;
  document.getElementById('progressText').textContent = `${total}/10`;
}

// ═══════════════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════════════
function exportJson() {
  const data = {
    timestamp: new Date().toISOString(),
    device: dev,
    stats: { done: doneCount, failed: failedCount },
    patches: patchResults
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `g1on-dump-${Date.now()}.json`;
  a.click();
  log('JSON exportado', 'success');
}

function exportLog() {
  let text = `Dump G1On - ${new Date().toISOString()}\n\n`;
  patchResults.forEach(p => {
    text += `${p.patch} (slot ${p.slot}): ${p.success ? 'OK' : 'FAIL'}\n`;
    if(p.success) {
      text += `  Nome: ${p.name}\n`;
      p.effects.forEach((fx, i) => {
        if(!fx.isEmpty) text += `  Slot ${i+1}: ${fx.name} (${fx.cat}) ${fx.en?'ON':'OFF'}\n`;
      });
    } else {
      text += `  Erro: ${p.error}\n`;
    }
    text += '\n';
  });
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `g1on-dump-${Date.now()}.txt`;
  a.click();
  log('Log exportado', 'success');
}

// ═══════════════════════════════════════════════════════════════════════
// SETUP

document.getElementById('btnConnect').onclick = async () => {
  try {
    await connect();
    document.getElementById('status').textContent = 'Conectado';
    document.getElementById('status').style.color = '#0f0';
  } catch(e) {
    log(`Erro: ${e.message}`, 'error');
  }
};

document.getElementById('btnExportLog').onclick = exportLog;
